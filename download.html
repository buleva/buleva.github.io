<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="/tailwindcss/output.css" rel="stylesheet">
    <script>
        const ua = navigator.userAgent.toLowerCase();
        const isiOS = /iphone|ipad|ipod/.test(ua);
        const isAndroid = /android/.test(ua);
        if (isiOS) {
            window.location.href = 'https://apps.apple.com/us/app/sing-on-pitch/id6443449637';
        } else if (isAndroid) {
            window.location.href = 'https://play.google.com/store/apps/details?id=com.singonpitch.pitch_android_v1';
        }
    </script>
</head>

<body>
    <div class="fixed inset-0 bg-black/20 dark:bg-black/90 z-50 overflow-y-auto py-[20px] px-[20px]">
        <div
            class="relative flex flex-col items-center gap-[20px] p-[40px] bg-white dark:bg-stone-900 rounded-[20px] border border-cyan shadow-cyan-glow max-w-[400px] my-auto mx-auto text-center">
            <h2 data-i18n="download_pitch_free" class="font-bold text-4xl text-black dark:text-white mt-[10px]">Download
                Pitch<br>for <span class="text-cyan">FREE</span></h2>
            <p data-i18n="scan_qr_code" class="text-gray-600 dark:text-gray-300">Scan the QR code to download right
                away:</p>
            <div class="bg-white rounded-[15px] p-[15px]">
                <img src="/images/qr-code_download.svg" alt="QR Code" class="w-[200px] h-[200px]">
            </div>
            <p data-i18n="or_open_app_store" class="text-gray-600 dark:text-gray-300">OR open your app store to install:
            </p>
            <div class="flex gap-[15px] flex-wrap justify-center">
                <a href="https://apps.apple.com/us/app/sing-on-pitch/id6443449637" target="_blank">
                    <img data-i18n="appstore_download" data-i18n-attr="src"
                        src="/images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
                        alt="Download on the App Store" class="h-[50px]">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.singonpitch.pitch_android_v1" target="_blank">
                    <img data-i18n="playstore_download" data-i18n-attr="src"
                        src="/images/GetItOnGooglePlay_Badge_Web_color_English.svg" alt="Get it on Google Play"
                        class="h-[50px]">
                </a>
            </div>
        </div>
    </div>
</body>

</html>
